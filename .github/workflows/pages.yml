# The project's site on GitHub Pages (Settings > Pages > Source: GitHub Actions): site/ with the
# screenshots, and the latest release's full image for the browser installer.
name: Site
on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest release's full image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern '*-full.bin' --dir release || true
      - name: Build the site
        env:
          SITE_URL: https://huseyinkozan.github.io/astronomical-watch/
        run: sh tools/make_site.sh $(ls release/*-full.bin 2>/dev/null | head -n 1)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
